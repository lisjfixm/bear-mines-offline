// localStorage 儲存（取代 Sekai save postMessage）
(function () {
  'use strict';
  var KEY = 'bear-mines-save-v1';
  var kept = {};
  try { kept = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { kept = {}; }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(kept)); } catch (e) {} }
  window.__sekaiSave = {
    ready: Promise.resolve(),
    status: function () { return 'ready'; },
    flush: persist,
    getItem: function (k) { k = String(k); return Object.prototype.hasOwnProperty.call(kept, k) ? kept[k] : null; },
    setItem: function (k, v) { kept[String(k)] = String(v); persist(); },
    removeItem: function (k) { delete kept[String(k)]; persist(); },
    clear: function () { kept = {}; persist(); }
  };
  // 音訊解鎖
  var unlocked = false;
  function unlock() {
    if (unlocked) return; unlocked = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { var c = new AC(); if (c.state === 'suspended') c.resume(); }
    } catch (e) {}
  }
  ['touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, unlock, { once: true });
  });
  // 離線無 parent：把 postMessage 與 social action 變成 no-op
  window.addEventListener('message', function () {});
})();
</script>

<script>/* ---------- 離線開機：載入本地 runtime.js，取代原本 fetch CDN runtime ---------- */
window.RemixBoot = { pending: true };
(function () {
  const box = document.getElementById('remix-loading'), bar = document.getElementById('remix-loading-bar'),
        label = document.getElementById('remix-loading-label'), phase = document.getElementById('remix-loading-phase');
  let value = 0;
  function update(n, text) {
    value = Math.max(value, n);
    bar.style.width = value + '%';
    bar.parentElement.setAttribute('aria-valuenow', String(Math.round(value)));
    label.textContent = Math.round(value) + '%';
    phase.textContent = text;
  }
  box.addEventListener('pointerdown', e => {
    for (let i = 0; i < 7; i++) {
      const c = document.createElement('i'); c.className = 'bm-tap';
      c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px';
      const a = Math.random() * 6.283, d = 40 + Math.random() * 60;
      c.style.setProperty('--x', Math.cos(a) * d + 'px');
      c.style.setProperty('--y', Math.sin(a) * d - 30 + 'px');
      box.appendChild(c); setTimeout(() => c.remove(), 720);
    }
  });
  update(8, window.REMIX.TEXT.downloading);

  function bootDone() {
    window.RemixBoot.pending = false;
    window.dispatchEvent(new Event('remix:runtime-ready'));
    update(82, window.REMIX.TEXT.starting);
    const wait = setInterval(async () => {
      try {
        if (!window.System) return;
        const cc = await System.import('cc');
        update(88, window.REMIX.TEXT.finishing);
        const scene = cc.director.getScene();
        if (!scene || !scene.getChildByName('Canvas_3d')) return;
        if (!document.body.dataset.characterRemix || !document.body.dataset.miningUi || !document.body.dataset.buildingRemix || !document.body.dataset.workerRemix) return;
        clearInterval(wait);
        update(96, 'Almost there…');
        cc.director.once(cc.Director.EVENT_AFTER_DRAW, () => {
          finishLoading();
        });
      } catch (e) {
        clearInterval(wait);
        phase.textContent = window.getLangString ? window.getLangString('loading_fail') : 'Could not load the mine.';
        label.textContent = '';
        console.error('Mine boot:', e);
      }
    }, 100);
    // Safety fallback: never trap the player on the loading screen. If the scene exists but a remix
    // hook is slow (or headless can't drive the game loop), dismiss after 18 s so gameplay is visible.
    setTimeout(() => {
      if (box.classList.contains('finished')) return;
      clearInterval(wait);
      finishLoading();
    }, 18000);
    function finishLoading() {
      update(100, window.getLangString ? window.getLangString('loading_ready') : 'Ready!');
      box.classList.add('finished');
      setTimeout(() => { box.style.display = 'none'; }, 320);
    }
  }

  const s = document.createElement('script');
  s.src = './runtime.js';
  s.onload = bootDone;
  s.onerror = function () {
    phase.textContent = window.getLangString ? window.getLangString('loading_fail') : 'Could not load the mine.';
    label.textContent = '';
  };
  document.head.appendChild(s);
})();
</script>

<script>/* UI 圖示替換：logo 與 ore icon（沿用原版） */
(async()=>{
let cc;
const frames=new Map(),done=new Set(),bubbleDone=new Set();
async function frame(key){
  if(frames.has(key))return frames.get(key);
  const image=new Image();image.crossOrigin='anonymous';
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=RemixUIAssets[key]});
  const tex=new cc.Texture2D();tex.image=new cc.ImageAsset(image);
  const f=new cc.SpriteFrame();f.texture=tex;frames.set(key,f);return f;
}
let busy=false;
const tick=async()=>{
  if(busy||document.hidden||!window.System||!window.RemixUIAssets)return;
  busy=true;
  try{
    cc=cc||await System.import('cc');
    const scene=cc.director.getScene();
    if(!scene)return;
    async function w(node,path){
      const p=path+'/'+node.name;
      for(const comp of node.components){
        if(comp.bubbleIconNode&&!bubbleDone.has(comp)){
          const icon=comp.bubbleIconNode;
          const current=icon.spriteFrame;
          if(/wood|木头/i.test(current?.name||'')){
            const f=await frame('ore-icon');
            const ui=icon.node.getComponent(cc.UITransform);
            const size=ui?ui.contentSize.clone():null;
            icon.sizeMode=cc.Sprite.SizeMode.CUSTOM;
            icon.spriteFrame=f;
            if(size)ui.setContentSize(size);
          }
          bubbleDone.add(comp);
        }
      }
      if(!done.has(node)){
        let key;
        if(/\/logo_spr$/.test(p)||/\/download_panel\/ui_root\/logo$/.test(p))key='mining-logo';
        if(/icon_wood|icon_mutou/.test(node.name)||/wood|木头/i.test((node.getComponent(cc.Sprite)||{}).spriteFrame?.name||''))key='ore-icon';
        if(key){
          const s=node.getComponent(cc.Sprite);
          if(s){
            const ui=node.getComponent(cc.UITransform);
            if(ui&&ui.contentSize.width>=10){
              const old=ui.contentSize.clone();
              s.sizeMode=cc.Sprite.SizeMode.CUSTOM;
              const f=await frame(key);
              s.spriteFrame=f;
              for(const comp of node.components){
                if(comp!==s&&typeof comp.stopSweep==='function'){comp.stopSweep();comp.enabled=false}
              }
              ui.setContentSize(old);
              done.add(node);
            }
          }
        }
      }
      for(const n of node.children)await w(n,p);
    }
    await w(scene,'');
    document.body.dataset.miningUi='original-layout-preserved';
  }catch(e){
    document.body.dataset.miningUi='error: '+e.message;
    console.error(e);
  }finally{busy=false}
};
(function loop(){tick().finally(()=>setTimeout(loop,document.body.dataset.miningUi==='original-layout-preserved'?1000:80))})();
})();
</script>

    }

    let phase = Math.random() * 6, walk = 0, clock = Math.random() * 10, blinkAt = 1 + Math.random() * 3;
    function step(dt, distance) {
      dt = Math.min(.05, dt); clock += dt;
      const moving = distance > .001;
      walk += ((moving ? 1 : 0) - walk) * Math.min(1, dt * 10);
      if (moving) phase += distance * 5.2;
      const swing = Math.sin(phase), bounce = Math.abs(Math.cos(phase)), breath = Math.sin(clock * 2.2);
      parts['leg-1'].setRotationFromEuler(swing * 34 * walk, 0, 0); parts.leg1.setRotationFromEuler(-swing * 34 * walk, 0, 0);
      parts['arm-1'].setRotationFromEuler(-swing * 30 * walk, 0, -4 - 3 * walk); parts.arm1.setRotationFromEuler(swing * 30 * walk, 0, 4 + 3 * walk);
      parts.body.setPosition(rest.body.x, rest.body.y + bounce * .05 * walk + breath * .008 * (1 - walk), rest.body.z);
      parts.body.setRotationFromEuler(7 * walk, 0, swing * 6 * walk);
      parts.body.setScale(1 + breath * .012 * (1 - walk), 1 - breath * .012 * (1 - walk), 1 + breath * .012 * (1 - walk));
      parts.head.setRotationFromEuler(-12 + 4 * walk + Math.sin(clock * .9) * 2.5 * (1 - walk), Math.sin(clock * .6) * 7 * (1 - walk), -swing * 4 * walk);
      const flick = Math.max(0, Math.sin(clock * 1.7 + 1) - .93) * 14;
      parts['ear-1'].setRotationFromEuler(0, 0, 6 * bounce * walk + flick * 12); parts.ear1.setRotationFromEuler(0, 0, -6 * bounce * walk - flick * 6);
      parts.scarf.setRotationFromEuler(-32 * walk + Math.sin(clock * 9) * 9 * walk + breath * 2, 0, Math.sin(clock * 7) * 6 * walk);
      if (clock > blinkAt) { if (clock > blinkAt + .13) blinkAt = clock + 2 + Math.random() * 3; }
      const lid = clock > blinkAt ? .12 : 1;
      parts['eye-1'].setScale(1, lid, 1); parts.eye1.setScale(1, lid, 1);
      if (parts.lamp) { const glow = 1 + Math.sin(clock * 4) * .07; parts.lamp.setScale(glow, glow, 1); }
    }
    return { root, parts, triangles, step };
  }
  window.RemixBearKit = { build, looks: Object.keys(LOOKS) };
  let engine, done = false;
  const timer = setInterval(async () => {
    if (done || document.hidden || !window.System) return;
    try {
      engine = engine || await System.import('cc');
      const scene = engine.director.getScene();
      const player = scene?.getChildByName('Canvas_3d')?.getChildByName('nomalParentNode_buster_rotation_axe')?.getChildByName('buster_rotation_axe');
      if (!player) return;

      if (!skin?.skeleton) return;

      let yaw = Math.atan2(camera.x - here.x, camera.z - here.z) * 180 / Math.PI, heading = yaw;

    } catch (error) { document.body.dataset.characterError = error.message; console.error('Bear miner:', error); clearInterval(timer); }
  }, 100);
})();
</script>

<script>/* 營地建築換皮與配置（沿用原版） */
(()=>{let cc,mat,hooked=false,layout=false,replacedTotal=0;const seen=new WeakSet(),cache=new Map();

function mineEntrance(m,cx,ys,cz,w,d,h){const mh=Math.min(h,3.35);box(m,cx,ys+mh*.40,cz,w*.84,mh*.80,d*.75,[.38,.47,.56]);roof(m,cx,ys+mh*.80,cz,w*.94,mh*.30,d*.86,C.snow);const front=cz+d*.40;box(m,cx,ys+mh*.36,front,w*.42,mh*.66,.12,[.13,.20,.25]);for(const side of[-1,1]){box(m,cx+side*w*.245,ys+mh*.38,front+.12,w*.08,mh*.76,.22,C.timber);box(m,cx+side*w*.245,ys+mh*.47,front+.245,w*.09,.12,.035,C.gold);}box(m,cx,ys+mh*.75,front+.12,w*.60,.26,.25,C.timber);crystal(m,cx,ys+mh*.83,front+.29,.26);for(const side of[-1,1]){const x=cx+side*w*.37;box(m,x,ys+.22,front+.17,w*.19,.44,.55,[.38,.47,.56]);crystal(m,x,ys+.42,front+.46,.42);crystal(m,x+side*.25,ys+.24,front+.44,.27);}}
function model(kind,min,max){const key=kind+JSON.stringify([min,max]);if(cache.has(key))return cache.get(key);const m=g(),cx=(min.x+max.x)/2,cz=(min.z+max.z)/2,w=max.x-min.x,d=max.z-min.z,h=max.y-min.y;
if(kind==='mill'||kind==='mine'){if(kind==='mine')mineEntrance(m,cx,min.y,cz,w,d,h);else house(m,cx,min.y,cz,w*.82,d*.75,Math.min(h,3.35))}

function relocate(scene){const env=scene.getChildByName('Canvas_3d')?.getChildByName('layer_game');if(!env)return;function shift(n,dx,dz){if(!n)return;const old=n.position.clone();n.setPosition(old.x+dx,old.y,old.z+dz)}shift(env.getChildByName('CangkuPrefab'),-1.4,.5);const cols=env.getChildByPath('AllCollider/Collider2');for(const name of['PlayerCollider3','EnemyCollider3','EnemyCollider4','EnemyCollider5'])shift(cols?.getChildByName(name),-1.4,.5);shift(env.getChildByName('FaMuWuPrefab'),1.5,-1.6);shift(env.getChildByName('JinKuangPrefab'),1.5,1.5);layout=true;document.body.dataset.mineLayout='ok'}

<script>/* ---------- 延伸礦區（P0 修復）：橋、神殿、洞穴、可重生礦石、付費解鎖擴建墊 ---------- */
(()=>{
  const PAD_SAVE='bear-mines-ext-pads';
  const PAD_DEFS=[
    {id:12,x:-5,z:24,cost:40,name:'晶石石橋擴建'},
    {id:13,x:5,z:25,cost:60,name:'深邃礦洞營地'},
    {id:14,x:-12,z:22,cost:90,name:'遠古晶石神殿'},
    {id:15,x:0,z:32,cost:150,name:'傳奇礦王殿堂'}
  ];
  const ORE_SPAWNS=[[-6,23],[-3,28],[3,30],[0,25],[-10,32],[10,34],[15,22],[-15,24],[0,35],[6,22]];
  const RESPAWN_MS=30000;
  let cc,built=false,oreNodes=[],padNodes=[],tickN=0;

  function loadPads(){try{return JSON.parse(localStorage.getItem(PAD_SAVE)||'{}')}catch(e){return {}}}
  function savePads(p){try{localStorage.setItem(PAD_SAVE,JSON.stringify(p))}catch(e){}}
  function toast(msg){const t=document.getElementById('bm-skip-toast');if(!t)return;t.textContent=msg;t.hidden=false;t.style.opacity='1';setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.hidden=true},300)},2200);}

  function build(scene){
    const env=scene.getChildByName('Canvas_3d')?.getChildByName('layer_game');
    if(!env||!window.getRemixShape||built)return;
    built=true;
    const g=window.getRemixShape,m=window.getRemixMaterial;
    const ext=new cc.Node('ExtendedMiningZone');ext.layer=env.layer;ext.setParent(env);

    // 橋（用礦石造型鋪一段）
    for(let i=0;i<5;i++){const b=new cc.Node('ExtBridge_'+i);b.layer=ext.layer;b.setParent(ext);b.setPosition(0,0.1,16+i*1.2);let br=b.addComponent(cc.MeshRenderer);br.mesh=g('cart');br.setSharedMaterial(m(),0);b.setScale(0.5,0.5,0.5);}
    // 神殿 / 洞穴裝飾
    const shrine=new cc.Node('AncientShrine');shrine.layer=ext.layer;shrine.setParent(ext);shrine.setPosition(-12,0,26);shrine.setRotationFromEuler(0,25,0);let sr=shrine.addComponent(cc.MeshRenderer);sr.mesh=g('ancient-cluster');sr.setSharedMaterial(m(),0);sr.setScale(2.2,2.2,2.2);
    const cave=new cc.Node('DeepCrystalCave');cave.layer=ext.layer;cave.setParent(ext);cave.setPosition(12,0,28);cave.setRotationFromEuler(0,-20,0);let cr=cave.addComponent(cc.MeshRenderer);cr.mesh=g('ancient-cluster');cr.setSharedMaterial(m(),0);cr.setScale(2.6,2.6,2.6);

    // 10 個可重生礦石
    ORE_SPAWNS.forEach(([ox,oz],i)=>{
      const ore=new cc.Node('ExtOre_'+i);ore.layer=ext.layer;ore.setParent(ext);ore.setPosition(ox,0,oz);
      const r=ore.addComponent(cc.MeshRenderer);r.mesh=g(i%3===0?'ancient-cluster':'ore');r.setSharedMaterial(m(),0);
      ore.setScale(1.2,1.2,1.2);
      oreNodes.push({node:ore,respawnAt:0,cooldown:0});
    });

    // 4 個擴建墊（未解鎖=矮樁；解鎖=放大成建築）
    const unlocked=loadPads();
    PAD_DEFS.forEach(p=>{
      const pn=new cc.Node('ExtPad_'+p.id);pn.layer=ext.layer;pn.setParent(ext);pn.setPosition(p.x,0.05,p.z);
      const rend=pn.addComponent(cc.MeshRenderer);rend.mesh=g('ore');rend.setSharedMaterial(m(),0);
      const isUn=!!unlocked[p.id];
      pn.setScale(isUn?2.2:0.5,0.5,isUn?2.2:0.5);
      pn.extPadInfo=p;
      padNodes.push({node:pn,info:p,unlocked:isUn});
    });
    document.body.dataset.extendedMines='active';
  }

  function cashPack(){const pk=window.__bmCarriedPacks||{};return pk.cash||null}
  function crystalPack(){const pk=window.__bmCarriedPacks||{};return pk.crystals||null}
  function spendCash(n){const c=cashPack();if(!c)return false;try{if(typeof c.addResource==='function'){c.addResource(-n);c.setStackHeight&&c.setStackHeight();return true}}catch(e){}return false}
  function getCash(){const c=cashPack();if(!c)return 0;try{return c.getResource?c.getResource():(c.count||0)}catch(e){return 0}}

  function tick(){
    if(!cc||document.hidden)return;
    const scene=cc.director.getScene();if(!scene)return;
    if(!built)build(scene);if(!built)return;
    tickN++;if(tickN%3)return;  // 每 ~300ms
    const player=scene.getChildByName('Canvas_3d')?.getChildByName('nomalParentNode_buster_rotation_axe')?.getChildByName('buster_rotation_axe');
    if(!player)return;
    const pp=player.worldPosition;
    const now=Date.now();

    // 礦石採集 + 重生
    for(const o of oreNodes){
      if(!o.node.active)continue;
      if(o.cooldown>now)continue;
      const op=o.node.worldPosition;
      const d=Math.hypot(pp.x-op.x,pp.z-op.z);
      if(d<3.0){
        const cp=crystalPack();if(cp){try{cp.addResource();cp.setStackHeight&&cp.setStackHeight()}catch(e){}}
        o.cooldown=now+RESPAWN_MS;
        o.node.setScale(0.01,0.01,0.01);
        o.node.active=false;
        setTimeout(()=>{if(cc.isValid(o.node)){o.node.active=true;o.node.setScale(1.2,1.2,1.2)}},RESPAWN_MS);
      }
    }

    // 擴建墊：走近且現金足夠 → 付費解鎖
    const unlocked=loadPads();
    for(const p of padNodes){
      if(p.unlocked)continue;
      const wp=p.node.worldPosition;
      const d=Math.hypot(pp.x-wp.x,pp.z-wp.z);
      if(d<2.8){
        const cash=getCash();
        if(cash>=p.info.cost){
          spendCash(p.info.cost);
          p.unlocked=true;unlocked[p.info.id]=true;savePads(unlocked);
          p.node.setScale(2.2,2.2,2.2);
          toast('已解鎖：'+p.info.name);
        } else {
          if(tickN%12===0)toast(p.info.name+' 需要 '+p.info.cost+' 金幣');
        }
      }
    }
  }

  (async()=>{
    while(!window.System)await new Promise(r=>setTimeout(r,200));
    cc=await System.import('cc');
    setInterval(tick,100);
  })().catch(e=>{document.body.dataset.extMinesError=e.message;console.error('Ext mines:',e)});
})();
</script>

<script>/* ---------- P1-5 離線收益：關閉期間自動累積，回來一次結算（有上限） ---------- */
(()=>{
  const KEY='bear-mines-last-seen';
  function notice(text){
    const box=document.getElementById('bm-restoring');
    if(!box){return}
    box.innerHTML='<span>'+text+'</span>';box.hidden=false;
    setTimeout(()=>{box.hidden=true},4000);
  }
  // 記錄離開時間
  function stamp(){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}}
  window.addEventListener('pagehide',stamp);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stamp()});
  // 回來結算
  function settle(){
    let last=0;try{last=parseInt(localStorage.getItem(KEY)||'0',10)}catch(e){}
    if(!last)return;
    const awayMs=Date.now()-last;
    const awayMin=awayMs/60000;
    if(awayMin<1)return;  // 不到 1 分鐘不結算
    const packs=window.__bmCarriedPacks||{};
    const gainCrystals=Math.min(Math.round(awayMin*2),50);
    const gainCash=Math.min(Math.round(awayMin*5),200);
    try{
      if(packs.crystals&&gainCrystals>0)for(let i=0;i<gainCrystals;i++){packs.crystals.addResource&&packs.crystals.addResource();packs.crystals.setStackHeight&&packs.crystals.setStackHeight()}
      if(packs.cash&&gainCash>0)for(let i=0;i<gainCash;i++){packs.cash.addResource&&packs.cash.addResource();packs.cash.setStackHeight&&packs.cash.setStackHeight()}
      notice('離線收益 +'+gainCrystals+' 水晶 / +'+gainCash+' 金幣');
    }catch(e){}
  }
  // 等 packs 就緒後結算一次
  let tries=0;
  const h=setInterval(()=>{
    tries++;
    if((window.__bmCarriedPacks&&(window.__bmCarriedPacks.crystals||window.__bmCarriedPacks.cash))||tries>100){
      clearInterval(h);
      if(window.__bmCarriedPacks)settle();
    }
  },300);
})();
</script>


<script>/* 顧客小熊 cubs（沿用原版） */
(() => {
  let cc, started = false, serial = 0;
  const known = new WeakSet(), actors = [];
  const LOOKS = window.REMIX.CUSTOMERS.map(cub => cub.name);
  function attach(skin) {
    if (known.has(skin)) { skin.enabled = false; return; }
    known.add(skin);
    const model = skin.node.parent.parent;
    if (model.children.some(child => child.name.startsWith('RemixBear_'))) { skin.enabled = false; return; }
    const bear = window.RemixBearKit.build(cc, model, skin.node.layer, LOOKS[serial++ % LOOKS.length], window.REMIX.FEEL.customerSize);
    skin.enabled = false;
    actors.push({ model, bear, last: model.worldPosition.clone() });
    document.body.dataset.workerRemix = JSON.stringify({ workers: actors.length });
  }
  function scan(node, path) {
    path += '/' + node.name;
    if (/\/GuKeList[^/]*Parent\//.test(path)) {
      const skin = node.getComponent(cc.SkinnedMeshRenderer);
      if (skin && /JueSeD/.test(node.name)) attach(skin);
    }
    for (const child of node.children) scan(child, path);
  }
  function animate() {
    const dt = cc.game.deltaTime || 1 / 60;
    for (let i = actors.length - 1; i >= 0; i--) {
      const actor = actors[i];
      if (!cc.isValid(actor.model)) { actors.splice(i, 1); continue; }
      if (!actor.model.activeInHierarchy) continue;
      const now = actor.model.worldPosition, distance = Math.hypot(now.x - actor.last.x, now.z - actor.last.z);
      actor.last.set(now);
      actor.bear.step(dt, distance);
    }
  }
  const poll = setInterval(async () => {
    if (document.hidden || !window.System || !window.RemixBearKit) return;
    try {
      cc = cc || await System.import('cc');
      const scene = cc.director.getScene(); if (!scene) return;
      if (!started) { started = true; cc.director.on(cc.Director.EVENT_AFTER_UPDATE, animate); }
      scan(scene, '');
    } catch (error) { document.body.dataset.workerError = error.message; console.error('Bear cubs:', error); clearInterval(poll); }
  }, 150);
})();
</script>

<script>/* 進度與重新開始（localStorage 版，沿用原版邏輯） */
(() => {
  const KEY = 'progress';
  const PAD_DONE = 'AreaStickerEvent_areaStickerFull';
  const LAST_PAD = 11;
  const CARRIED = { cash: 'CashBackPack', crystals: 'WoodBackPack', meat: 'RawMeatBackPack', gold: 'GoldBackPack' };
  const REPLAY_SPEED = 8;
  let cc, manager, restoring = false, started = false;
  const unlocked = [];
  const packs = {};
  window.__bmCarriedPacks = packs;
  // 解鎖記錄去重；事件漏發時，以墊位自身 isFull 狀態補記。
  function recordPad(id) {
    if (id === undefined || id === null || id === '') return;
    if (!unlocked.includes(id)) unlocked.push(id);
  }
  function padId(pad, fallback) {
    return (pad && pad.areaStickerID !== undefined) ? pad.areaStickerID : fallback;
  }
  function eachPad(cb) {
    if (!manager || !manager.areaStickerMap) return;
    const m = manager.areaStickerMap;
    if (typeof m.forEach === 'function') m.forEach((pad, id) => cb(pad, id));
    else for (const id in m) if (Object.prototype.hasOwnProperty.call(m, id)) cb(m[id], id);
  }
  function reconcileFullPads() {
    eachPad((pad, id) => { if (pad && pad.isFull) recordPad(padId(pad, id)); });
  }
  const read = () => { try { return JSON.parse((window.__sekaiSave ? window.__sekaiSave.getItem(KEY) : null) || 'null'); } catch (error) { return null; } };
  function write() {
    if (restoring) return;
    const carried = {};
    for (const name in packs) carried[name] = packs[name].getResource();
    if (window.__sekaiSave) window.__sekaiSave.setItem(KEY, JSON.stringify({ version: 1, unlocked, carried, finished: unlocked.includes(LAST_PAD) }));
  }
  const clear = () => { if (window.__sekaiSave) { window.__sekaiSave.removeItem(KEY); window.__sekaiSave.flush(); } };
  const find = (className) => {
    const Class = cc.js.getClassByName(className);
    let found = null;
    (function walk(node) { for (const c of node.components) if (Class && c instanceof Class) found = c; node.children.forEach(walk); })(cc.director.getScene());
    return found;
  };
  const until = (test, limitMs) => new Promise((resolve) => {
    const startedAt = performance.now();
    (function check() { const value = test(); if (value) resolve(value); else if (performance.now() - startedAt > limitMs) resolve(null); else setTimeout(check, 40); })();
  });
  function notice(text) { const box = document.getElementById('bm-restoring'); if (box) box.hidden = !text; }
  async function restore(saved) {
    restoring = true; notice(true);
    const scheduler = cc.director.getScheduler();
    scheduler.setTimeScale(REPLAY_SPEED);
    try {
      for (const id of saved.unlocked) {
        let pad = manager.areaStickerMap.get(id);
        if (!pad) continue;                       // 單墊找不到不中止整批
        const pid = padId(pad, id);
        if (pad.isFull) { recordPad(pid); continue; }   // 已滿但漏記：直接補
        try {
          pad.trapFull();
          await until(() => pad.isFull, 3000);
        } catch (e) { console.warn('[progress] pad', pid, 'replay failed:', e); }
        if (pad.isFull) recordPad(pid);
      }
      reconcileFullPads();                         // 收尾再對帳一次
      for (const name in packs) {
        const amount = Math.max(0, Math.floor((saved.carried && saved.carried[name]) || 0));
        for (let i = 0; i < amount; i++) { packs[name].addResource(); packs[name].setStackHeight(); }
      }
    } finally { scheduler.setTimeScale(1); restoring = false; notice(false); }
    write();
  }
  async function start() {
    started = true;
    const events = (await System.import('chunks:///_virtual/EventManager.ts')).default;
    for (const name in CARRIED) { const pack = find(CARRIED[name]); if (pack) packs[name] = pack; }
    events.on(PAD_DONE, (pad) => { recordPad(padId(pad)); write(); }, window);
    if (window.__sekaiSave) await window.__sekaiSave.ready;
    const saved = read();
    // 破關後也保留營地、讓玩家繼續玩（含擴建礦區），不再自動清空開新營。
    // 只有玩家主動按左下角「重新開始」才會清檔。
    if (saved && Array.isArray(saved.unlocked) && (saved.unlocked.length || (saved.carried && Object.keys(saved.carried).length))) await restore(saved);
    setInterval(write, 3000);
    setInterval(reconcileFullPads, 3000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { write(); if (window.__sekaiSave) window.__sekaiSave.flush(); } });
    document.getElementById('bm-restart').hidden = false;
    const MILESTONE_PADS = [3, 7, 10, LAST_PAD];
    const skipBtn = document.getElementById('bm-skip-btn');
    const skipToast = document.getElementById('bm-skip-toast');
    function showSkipToast(text) {
      if (!skipToast) return; skipToast.textContent = text; skipToast.hidden = false; skipToast.style.opacity = '1';
      setTimeout(() => { skipToast.style.opacity = '0'; setTimeout(() => { skipToast.hidden = true; }, 300); }, 2000);
    }
    async function skipToNextMilestone() {
      if (!manager || restoring) return;
      reconcileFullPads();
      const targetMilestone = MILESTONE_PADS.find(id => !unlocked.includes(id)) || LAST_PAD;
      const needed = [];
      for (let i = 1; i <= targetMilestone; i++) if (!unlocked.includes(i) && i <= LAST_PAD) needed.push(i);
      const padsToRestore = { unlocked: needed, carried: { cash: 100, crystals: 50 } };
      skipBtn.disabled = true;
      try {
        await restore(padsToRestore);
        const t = window.getLangTexts ? window.getLangTexts() : null;
        showSkipToast(t ? (t.skip_toast || '已跳轉至里程碑！') : '已跳轉至里程碑！');
      } catch (e) { console.error('Skip failed:', e); } finally { skipBtn.disabled = false; }
    }
    if (skipBtn) skipBtn.addEventListener('click', skipToNextMilestone);
  }
  const button = document.getElementById('bm-restart'), ask = document.getElementById('bm-restart-ask');
  button.addEventListener('click', () => { ask.hidden = !ask.hidden; });
  document.getElementById('bm-restart-no').addEventListener('click', () => { ask.hidden = true; });
  document.getElementById('bm-restart-yes').addEventListener('click', () => {
    button.disabled = true; ask.hidden = true; restoring = true;
    try { clear(); } catch (error) { console.error('clear save:', error); }
    setTimeout(() => window.location.reload(), 250);
  });
  const poll = setInterval(async () => {
    if (started || !window.System) return;
    try {
      cc = cc || await System.import('cc');
      if (!cc.director.getScene()) return;
      manager = find('AreaStickerMgr');
      if (!manager || !manager.areaStickerMap.size || started) return;
      clearInterval(poll);
      await start();
    } catch (error) { clearInterval(poll); console.error('Progress:', error); }
  }, 150);
})();
</script>

<script>/* 音效：本地 bgm / effects（沿用原版解碼邏輯） */
(() => {
  const sound = window.REMIX.SOUND, feel = window.REMIX.FEEL;
  let cc, done = false;
  const decoded = new Map();
  async function clip(url, like, name) {
    try {
      const response = await fetch(new URL(url, document.baseURI).href);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const Outer = like._player.constructor, Inner = like._player._player.constructor;
      const buffer = await like._player._player._gainNode.context.decodeAudioData(await response.arrayBuffer());
      if (!Inner.__remixLoader) {
        const packed = Inner.loadNative;
        Inner.loadNative = (address) => decoded.has(address) ? Promise.resolve(decoded.get(address)) : packed.call(Inner, address);
        Inner.__remixLoader = true;
      }
      decoded.set(url, buffer);
      const made = new cc.AudioClip();
      made.name = name; made._nativeUrl = url;
      made._nativeAsset = { player: new Outer(new Inner(buffer, url)), url, duration: buffer.duration, type: like._nativeAsset.type };
      made.duration = buffer.duration;
      return made;
    } catch (error) { console.warn('[sound] could not load ' + url, error && error.message); return null; }
  }
  async function setup() {
    const Manager = cc.js.getClassByName('AudioMgr');
    let manager = null;
    (function find(node) { for (const c of node.components) if (Manager && c instanceof Manager) manager = c; node.children.forEach(find); })(cc.director.getScene());
    if (!manager || !manager.bgm || !manager.spriteClip) return false;
    done = true;
    const sprite = (await System.import('chunks:///_virtual/AudioSpriteConfig.ts')).AudioSpriteConfig;
    for (const name in sound.SLOTS) {
      if (!sprite[name]) continue;
      sprite[name].start = sound.SLOTS[name][0]; sprite[name].end = sound.SLOTS[name][1];
    }
    const levels = (await System.import('chunks:///_virtual/AudioConfig.ts')).default.inst();
    for (const key in levels) {
      const entry = levels[key];
      if (!entry || typeof entry.volume !== 'number') continue;
      entry.volume = entry.urlName === 'bgm' ? feel.musicVolume : Math.min(1, entry.volume * feel.soundVolume);
    }
    const [music, effects] = await Promise.all([clip(sound.music, manager.spriteClip, 'bgm'), clip(sound.effects, manager.spriteClip, 'sfx_sprite')]);
    if (effects) manager.spriteClip = effects;
    if (music) {
      const packed = manager.playMusic;
      manager.playMusic = function (name, loop, volume) {
        if (name !== 'bgm') return packed.apply(this, arguments);
        this.bgm.stop(); this.bgm.clip = music; this.bgm.loop = loop !== false; this.bgm.volume = volume === undefined ? feel.musicVolume : volume; this.bgm.play();
      };
      if (manager.bgm.playing) manager.playMusic('bgm', true, feel.musicVolume);
    }
    document.body.dataset.soundRemix = JSON.stringify({ music: !!music, effects: !!effects });
    return true;
  }
  const poll = setInterval(async () => {
    if (done || !window.System) return;
    try {
      cc = cc || await System.import('cc');
      if (cc.director.getScene()) await setup();
      if (done) clearInterval(poll);
    } catch (error) { clearInterval(poll); console.error('Sound:', error); }
  }, 120);
})();
</script>
